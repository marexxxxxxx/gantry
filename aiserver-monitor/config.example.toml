# Beispielkonfiguration fuer aiserver-monitor.
# Alle Felder sind optional; die Werte in den Kommentaren sind die Defaults.
# Umgebungsvariablen ueberschreiben die Datei: AISERVER_MONITOR_<FELDNAME>
# in Grossbuchstaben, z. B. AISERVER_MONITOR_LISTEN_PORT=39999.

# --- Netzwerk ---
# listen_host = "0.0.0.0"
# listen_port = 30000
# upstream_base = "http://127.0.0.1:30001"

# --- Embeddings (eigener CPU-Ollama, nur lokal gebunden) ---
# /v1/embeddings wird hierhin geroutet statt an upstream_base. Das Modell
# laeuft auf der CPU und kann parallel zum Chat-Backend arbeiten.
# embed_base = "http://127.0.0.1:30002"
# embed_model = "qwen3-embedding:0.6b"

# --- Modell-Lebenszyklus (/v1/load, /v1/unload, /v1/status) ---
# /v1/load laedt Modellnamen additiv; /v1/unload gibt Gewichte frei (Qwen
# wird gestoppt, Ollama-Sidecars behalten ihren Prozess). Der Embedding-
# Sidecar wird bei Bedarf lokal gestartet; Timeouts und Poll-Takt gelten fuer
# alle Backends. Pfade sind relativ zur Repo-Wurzel.
# embed_start_script = "runtime/embed/start-embed.sh"
# lifecycle_timeout_s = 900.0
# lifecycle_unload_timeout_s = 60.0
# lifecycle_poll_s = 0.5

# --- Qwen3-TTS (optional, GPU; /v1/load, /v1/unload, /v1/audio/speech) ---
# Der Worker laeuft nur auf der GPU, nachdem der Chat entladen wurde. Sein
# Prozess wird bei /v1/unload gestoppt, damit der CUDA-Kontext frei wird.
# qwen_tts_model = "Qwen3-TTS"
# qwen_tts_base = "http://127.0.0.1:30005"
# qwen_tts_model_dir = "/mnt/models/audio/experiments/qwen"
# qwen_tts_start_script = "runtime/qwen-tts/start-qwen-tts.sh"
# qwen_tts_stop_script = "runtime/qwen-tts/stop-qwen-tts.sh"
# qwen_tts_pidfile = "runtime/qwen-tts/qwen-tts.pid"
# qwen_tts_health_path = "/healthz"
# qwen_tts_load_timeout_s = 900.0
# qwen_tts_unload_timeout_s = 60.0

# --- Audio8-TTS (optional, GPU; /v1/load, /v1/unload, /v1/audio/speech) ---
# 0,6B-Modell mit 23 Sprachen und 44,1-kHz-Codec. Es nutzt eine feste
# maennliche Referenzstimme (de_male) und laeuft wie Qwen3-TTS nur, nachdem
# der Chat entladen wurde; /v1/unload stoppt den Worker-Prozess.
# audio8_model = "Audio8-Realistic-Air"   # "" deaktiviert das Profil
# audio8_base = "http://127.0.0.1:30006"
# audio8_model_dir = "/mnt/models/audio/audio8"
# audio8_reference_audio = "/mnt/models/audio/audio8/reference/de_male.wav"
# audio8_reference_text = "/mnt/models/audio/audio8/reference/de_male.txt"
# audio8_start_script = "runtime/audio8/start-audio8.sh"
# audio8_stop_script = "runtime/audio8/stop-audio8.sh"
# audio8_pidfile = "runtime/audio8/audio8.pid"
# audio8_health_path = "/healthz"
# audio8_load_timeout_s = 900.0
# audio8_unload_timeout_s = 60.0

# --- Audio (Whisper/Piper auf der CPU, nur lokal gebunden) ---
# /v1/audio/* wird an diesen Sidecar geroutet. Uploads und Antworten werden
# gestreamt; das Gateway puffert keine Audiodateien.
# audio_base = "http://127.0.0.1:30003"
# audio_timeout_s = 1800.0
# audio_max_upload_mb = 100

# --- Pfade ---
# db_path = "data/monitor.db"
# log_path = "data/aiserver-monitor.log"

# --- Intervalle und Timeouts (Sekunden) ---
# heartbeat_s = 15.0
# poll_interval_s = 2.0
# connect_timeout_s = 10.0

# --- Vorschau (maximale Zeichen im RAM) ---
# preview_max_chars = 4096
# prompt_start_chars = 100

# --- Retention (Tage) ---
# retention_jobs_days = 30
# retention_series_days = 7

# --- Sonstiges ---
# nonstream_keepalive = true
# gpu_cmd = "nvidia-smi"

# Verwaiste Jobs bei Client-Abbruch aufraeumen: bricht der Client die
# Verbindung ab, wird der wartende Upstream-Aufruf gecancelt und der Job als
# "aborted" abgeschlossen (dazu best effort abort_request an SGLang).
# false = altes Verhalten: Jobs laufen immer zu Ende.
# abort_on_disconnect = true

# --- Server-Steuerung (Dashboard-Tab "Server", server.sh) ---
# Schaltet den Modellserver ein/aus. Pfade sind relativ zur Repo-Wurzel.
# Ist die systemd-User-Unit installiert, wird sie fuer start/stop benutzt.
# server_control_enabled = true
# server_unit = "escha-server.service"
# server_start_script = "runtime/sglang/start-penalty.sh"
# server_stop_script = "runtime/sglang/stop-server.sh"
# server_process_pattern = "[s]glang.launch_server"
#
# Zweites Backend "flint" (Ollama auf demselben Upstream-Port 30001).
# Die Skripte starten/stoppen einen eigenen ollama-Prozess; der System-Dienst
# auf Port 11434 bleibt unberuehrt.
# flint_start_script = "runtime/flint/start-flint.sh"
# flint_stop_script = "runtime/flint/stop-flint.sh"
# flint_pidfile = "runtime/flint/flint.pid"
# flint_health_path = "/api/version"
#
# GPT-OSS-Backend: eigener Ollama-Prozess, 64k Kontext, 1 Slot.
# gptoss_start_script = "runtime/gptoss/start-gptoss.sh"
# gptoss_stop_script = "runtime/gptoss/stop-gptoss.sh"
# gptoss_pidfile = "runtime/gptoss/gptoss.pid"
#
# Abliterated-Backend: Qwen3-14B ohne Refusal-Verhalten, 40k Kontext, 1 Slot.
# abl_start_script = "runtime/abl/start-abl.sh"
# abl_stop_script = "runtime/abl/stop-abl.sh"
# abl_pidfile = "runtime/abl/abl.pid"
#
# Modell-Alias: Clients duerfen weiterhin den Qwen-Namen senden. Laeuft Flint,
# GPT-OSS oder Abliterated, schreibt das Gateway ihn auf das jeweilige Modell
# um; bei Qwen bleibt er unveraendert. Fuer GPT-OSS setzt das Gateway
# zusaetzlich temperature 0 und reasoning_effort "low", wenn der Client nichts
# vorgibt.
# model_alias = "escha-qwen38-27b-w2"
# flint_model = "hf.co/AtomicChat/Flint-GGUF:IQ4_XS"
# gptoss_model = "gpt-oss:20b"
# abl_model = "hf.co/bartowski/huihui-ai_Qwen3-14B-abliterated-GGUF:Q4_K_M"
# Edge0 120B laeuft als eigenes Backend (eigener Prozess, kein Ollama). Der
# Alias oben bleibt der stabile Name fuer Clients; das Gateway schreibt ihn
# auf das aktive Modell um, auch auf edge0_model.
# edge0_model = "edge0-120b"
# edge0_start_script = "runtime/edge0/start-edge0.sh"
# edge0_stop_script = "runtime/edge0/stop-edge0.sh"
# edge0_pidfile = "runtime/edge0/edge0.pid"
# edge0_health_path = "/health"
# Edge0 denkt von sich aus bis zu 48k Tokens und blockiert dabei den einzigen
# Slot (5-20 min pro Antwort). "off" setzt reasoning_effort="none" solange der
# Client kein thinking:true schickt; "low" setzt "low" plus ein Budget von
# edge0_thinking_budget_tokens; "on" laesst den Client-/Modell-Default stehen.
# "auto" eskaliert nach Wiederholungen: ein frischer Verlauf denkt nicht, ein
# Retry desselben Verlaufs bekommt 1024 Tokens, ab dem dritten Versuch 8192.
# edge0_thinking = "off"
# edge0_thinking_budget_tokens = 1024
# Obergrenze fuer max_tokens bei Edge0-Chats; 0 schaltet den Deckel ab.
# edge0_max_tokens = 8192

# --- Chatterbox (optionaler CPU-TTS-Worker) ---
# Der Audio-Sidecar spricht den Worker auf 127.0.0.1:30004 an.
# AUDIO_CHATTERBOX_BASE="http://127.0.0.1:30004"
# AUDIO_CHATTERBOX_TIMEOUT=120
